<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de cliente - Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-grey">

  <main class="container-fluid dotted-frame py-5" style="min-height: calc(100vh - 64px); background: var(--grey);">
    <div class="container">
      <div class="row align-items-center g-5">

        <div class="col-lg-5 text-center text-lg-start">
          <h1 class="pixel-title dark mb-5">Cadastro de<br>cliente</h1>
          <div class="info-win mt-5">
            <div class="bar"></div>
            <span class="badge-i">ℹ️</span>
            <p class="m-0 p-3 fs-5">Crie sua conta para cadastrar seu cachorro e agendar banhos.</p>
          </div>
          <div class="fs-1 mt-4">💾 🦖</div>
        </div>

        <div class="col-lg-7">
          <form class="form-card" action="login-cliente.html" method="get">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome completo</label>
              <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="login" class="form-label">Login</label>
              <input type="text" class="form-control" id="login" name="login" autocomplete="username" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" minlength="6" autocomplete="new-password" required>
              </div>
              <div class="col-md-6 mb-4">
                <label for="senha2" class="form-label">Confirmar senha</label>
                <input type="password" class="form-control" id="senha2" name="senha2" minlength="6" autocomplete="new-password" required>
              </div>
            </div>
            <button type="submit" class="btn-blue">Cadastrar</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="taskbar">
    <div class="icons">
      <span class="start">🍎</span><span>🖨️</span><span>📝</span><span>🎲</span><span>🌐</span><span>📠</span>
    </div>
    <div class="d-flex gap-2">
      <a href="login-cliente.html" class="btn-retro">Voltar</a>
      <a href="index.html" class="btn-retro">Voltar ao início</a>
    </div>
  </footer>

</body>
</html>
