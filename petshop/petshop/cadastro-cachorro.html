<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de cachorro - Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-grey">

  <main class="container-fluid dotted-frame py-5" style="min-height: calc(100vh - 64px); background: var(--grey);">
    <div class="container">
      <div class="row align-items-center g-5">

        <div class="col-lg-5 text-center text-lg-start">
          <h1 class="pixel-title dark mb-5">Cadastro de<br>cachorro</h1>

          <div class="info-win mt-5">
            <div class="bar"></div>
            <span class="badge-i">ℹ️</span>
            <p class="m-0 p-3 fs-5">
              Insira todas as informações sobre seu animal para ter o banho agendado conforme a disponibilidade da loja.
            </p>
          </div>

          <div class="fs-1 mt-4">💾 🦖</div>
        </div>

        <div class="col-lg-7">
          <form class="form-card" action="#" method="post">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="mb-3">
              <label for="raca" class="form-label">Raça</label>
              <input type="text" class="form-control" id="raca" name="raca" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" min="0" class="form-control" id="idade" name="idade" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input type="number" min="0" step="0.1" class="form-control" id="peso" name="peso" required>
              </div>
            </div>
            <div class="mb-4">
              <label for="obs" class="form-label">Observações</label>
              <textarea class="form-control" id="obs" name="observacoes" rows="3"></textarea>
            </div>
            <button type="submit" class="btn-blue">Enviar</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="taskbar">
    <div class="icons">
      <span class="start">🍎</span><span>🖨️</span><span>📝</span><span>🎲</span><span>🌐</span><span>📠</span>
    </div>
    <div class="d-flex gap-2">
      <a href="javascript:history.back()" class="btn-retro">Voltar</a>
      <a href="index.html" class="btn-retro">Voltar ao início</a>
    </div>
  </footer>

</body>
</html>
