<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login do cliente - Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-blue">

  <span class="tag-visao">Visão do cliente</span>

  <main class="container py-5" style="min-height: calc(100vh - 64px);">
    <div class="row align-items-center g-5" style="min-height: 75vh;">

      <div class="col-lg-6">
        <h1 class="pixel-title">Acesso do<br>cliente</h1>
        <div class="info-win mt-5">
          <div class="bar"></div>
          <span class="badge-i">ℹ️</span>
          <p class="m-0 p-3 fs-5">Entre com seu login e senha. Ainda não tem conta? Faça seu cadastro.</p>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="win">
          <div class="win-title bg-teal" style="background: var(--teal);"><span>Login</span><span class="x">✕</span></div>
          <div class="win-body">
            <form action="cliente.html" method="get">
              <div class="mb-3">
                <label for="login" class="form-label">Login</label>
                <input type="text" class="form-control" id="login" name="login" autocomplete="username" required>
              </div>
              <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn-blue">Entrar</button>
            </form>
            <hr>
            <p class="mb-2 text-center">Primeira vez aqui?</p>
            <a href="cadastro-cliente.html" class="btn-retro w-100 text-center">Cadastrar-se</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="taskbar">
    <div class="icons">
      <span class="start">🍎</span><span>🖨️</span><span>📝</span><span>🎲</span><span>🌐</span><span>📠</span>
    </div>
    <div class="d-flex gap-2">
      <a href="escolha.html" class="btn-retro">Voltar</a>
      <a href="index.html" class="btn-retro">Voltar ao início</a>
    </div>
  </footer>

</body>
</html>
