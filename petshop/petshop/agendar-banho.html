<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar banho - Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-grey">

  <main class="container-fluid dotted-frame py-5" style="min-height: calc(100vh - 64px); background: var(--grey);">
    <div class="container">
      <div class="row align-items-center g-5">

        <div class="col-lg-5 text-center text-lg-start">
          <h1 class="pixel-title dark mb-5">Agendar<br>banho</h1>

          <div class="info-win mt-5">
            <div class="bar"></div>
            <span class="badge-i">ℹ️</span>
            <p class="m-0 p-3 fs-5">
              Escolha o animal já cadastrado, o dia e o horário. O banho será confirmado conforme a disponibilidade da loja.
            </p>
          </div>

          <div class="fs-1 mt-4">🛁 🐶</div>
        </div>

        <div class="col-lg-7">
          <form class="form-card" action="#" method="post">
            <div class="mb-3">
              <label for="animal" class="form-label">Animal</label>
              <select class="form-select" id="animal" name="animal" required>
                <option value="" selected disabled>Selecione o animal</option>
                <option>Mavies — 012</option>
                <option>Goiabada — 067</option>
                <option>Meio Dia — 042</option>
                <option>Pituca — 090</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="data" class="form-label">Data</label>
                <input type="date" class="form-control" id="data" name="data" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="hora" class="form-label">Horário</label>
                <select class="form-select" id="hora" name="hora" required>
                  <option value="" selected disabled>Selecione</option>
                  <option>08:00</option><option>09:00</option><option>10:00</option>
                  <option>11:00</option><option>13:00</option><option>14:00</option>
                  <option>15:00</option><option>16:00</option><option>17:00</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="tipo" class="form-label">Tipo de banho</label>
              <select class="form-select" id="tipo" name="tipo" required>
                <option>Banho simples</option>
                <option>Banho e tosa</option>
                <option>Banho medicinal</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="obs" class="form-label">Observações</label>
              <textarea class="form-control" id="obs" name="observacoes" rows="3"></textarea>
            </div>
            <button type="submit" class="btn-blue">Agendar</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="taskbar">
    <div class="icons">
      <span class="start">🍎</span><span>🖨️</span><span>📝</span><span>🎲</span><span>🌐</span><span>📠</span>
    </div>
    <div class="d-flex gap-2">
      <a href="javascript:history.back()" class="btn-retro">Voltar</a>
      <a href="index.html" class="btn-retro">Voltar ao início</a>
    </div>
  </footer>

</body>
</html>
